name: Test

# Every push to main is tested, and so is every pull request into it, so that a
# change is known to pass before it lands rather than only after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# a newer push to the same branch or pull request makes the older run moot
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: vet and gofmt
        run: make lint

      # vet on Linux never compiles the *_windows.go and *_darwin.go files, so
      # a build break in one of them would otherwise first show in a release
      - name: vet for windows and darwin
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test:
    # the binaries ship for all three, and the filesystems differ where it
    # matters here: case folding, separators, permissions and symlinks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # the race detector runs where it is cheapest; every server here is
      # concurrent, so it runs on every change all the same
      - name: test with race detector and coverage
        if: runner.os == 'Linux'
        run: |
          go test ./... -race -count=1 -timeout 15m -coverprofile=coverage.out
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: test
        if: runner.os != 'Linux'
        run: go test ./... -count=1 -timeout 15m

      - name: upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # every release target still cross compiles
      - name: make build
        run: make build

  fuzz:
    # the seed corpora run in every test job above; the longer run is for main,
    # where it has time to find what the seeds do not
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: fuzz
        run: make fuzz FUZZTIME=20s

      # a failing input is written under testdata/fuzz; committing it makes it
      # part of the seed corpus from then on
      - name: upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: '**/testdata/fuzz/**'
