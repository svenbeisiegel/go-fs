name: Test

# Every push to main is tested, and so is every pull request into it, so that a
# change is known to pass before it lands rather than only after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# a newer push to the same branch or pull request makes the older run moot
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: vet and gofmt
        run: make lint

      # vet on Linux never compiles the *_windows.go and *_darwin.go files, so
      # a build break in one of them would otherwise first show in a release
      - name: vet for windows and darwin
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test:
    # the binaries ship for all three, and the filesystems differ where it
    # matters here: case folding, separators, permissions and symlinks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # the race detector runs where it is cheapest; every server here is
      # concurrent, so it runs on every change all the same
      - name: test with race detector and coverage
        if: runner.os == 'Linux'
        run: |
          go test ./... -race -count=1 -timeout 15m -coverprofile=coverage.out
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: test
        if: runner.os != 'Linux'
        run: go test ./... -count=1 -timeout 15m

      - name: upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # every release target still cross compiles
      - name: make build
        run: make build

  fuzz:
    # the seed corpora run in every test job above; the longer run is for main,
    # where it has time to find what the seeds do not
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: fuzz
        run: make fuzz FUZZTIME=20s

      # a failing input is written under testdata/fuzz; committing it makes it
      # part of the seed corpus from then on
      - name: upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: '**/testdata/fuzz/**'

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # a second, higher version as well, for the upgrade below
      - name: make packages
        run: |
          make packages
          make rpm VERSION="$(cat VERSION).1"

      # install, start, upgrade and remove the rpm the way dnf does on a
      # server; the container has no systemd, so go-fs is started by hand as
      # the account the unit runs it as. The upgrade keeps the configuration
      # go-fs wrote its secrets into, and the removal keeps it as
      # go-fs.toml.rpmsave, which rpm does with every changed config file.
      - name: install the rpm
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" rockylinux:9 sh -euxc '
            version=$(ls /dist/go-fs-*.x86_64.rpm | sort -V | head -1)
            update=$(ls /dist/go-fs-*.x86_64.rpm | sort -V | tail -1)
            dnf install -y "$version"
            id go-fs
            test "$(stat -c %U:%a /etc/go-fs/go-fs.toml)" = go-fs:600
            test "$(stat -c %U /var/lib/go-fs/files)" = go-fs
            test "$(stat -c %U /var/lib/go-fs/registry)" = go-fs
            grep -qxF "registryBaseFolder = \"/var/lib/go-fs/registry\"" /etc/go-fs/go-fs.toml
            runuser -u go-fs -- /usr/bin/go-fs -check -config /etc/go-fs/go-fs.toml
            setpriv --reuid go-fs --regid go-fs --init-groups \
              /usr/bin/go-fs -config /etc/go-fs/go-fs.toml > /tmp/go-fs.log 2>&1 &
            pid=$!
            for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.5; done
            curl -fsS -o /dev/null http://127.0.0.1:8080/
            kill $pid; wait $pid || true
            cat /tmp/go-fs.log
            grep -q "installer=rpm" /tmp/go-fs.log
            grep -q "documentation prints" /tmp/go-fs.log
            grep -q "^httpSessionTokenSecret = \"..*\"" /etc/go-fs/go-fs.toml
            dnf install -y "$update"
            rpm -q go-fs
            grep -q "^httpSessionTokenSecret = \"..*\"" /etc/go-fs/go-fs.toml
            dnf remove -y go-fs
            test ! -e /usr/bin/go-fs
            grep -q "^httpSessionTokenSecret = \"..*\"" /etc/go-fs/go-fs.toml.rpmsave
          '

      - uses: actions/upload-artifact@v7
        with:
          name: msi-inputs
          path: |
            build/pkg/go-fs_windows_*.exe
            build/pkg/go-fs.windows.toml
          if-no-files-found: error

  msi:
    needs: packages
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: Major
      WIX_VERSION: 5.0.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: msi-inputs
          path: build/pkg

      - name: install the WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add --global WixToolset.Util.wixext/$env:WIX_VERSION
          wix extension add --global WixToolset.Firewall.wixext/$env:WIX_VERSION
          wix extension add --global WixToolset.UI.wixext/$env:WIX_VERSION

      - name: build the msi
        shell: pwsh
        run: |
          wix build packaging/windows/go-fs.wxs -arch x64 `
            -ext WixToolset.Util.wixext -ext WixToolset.Firewall.wixext -ext WixToolset.UI.wixext `
            -d Version=0.0.1 `
            -d Bin="$PWD\build\pkg\go-fs_windows_amd64.exe" `
            -d Config="$PWD\build\pkg\go-fs.windows.toml" `
            -o go-fs.msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # install it as an admin would, quietly, and see the service come up and
      # serve, then go away again with the uninstall
      - name: install the msi
        shell: pwsh
        run: |
          $install = Start-Process msiexec -Wait -PassThru -ArgumentList "/i go-fs.msi /qn /l*v install.log"
          if ($install.ExitCode -ne 0) { Get-Content install.log -Tail 80; exit $install.ExitCode }
          $service = Get-Service go-fs
          $service | Format-List Name, Status, StartType
          if ($service.StartType -ne "Automatic") { throw "the service does not start with Windows" }
          $up = $false
          foreach ($i in 1..20) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/ | Out-Null; $up = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          $log = "$env:ProgramData\go-fs\logs\go-fs.log"
          Get-Content $log
          if (-not $up) { throw "go-fs does not answer on 127.0.0.1:8080" }
          if (-not (Test-Path "$env:ProgramData\go-fs\registry")) { throw "the install made no registry folder" }
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/v2/ | Out-Null }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw "the registry does not answer on /v2/: $_" } }
          if (-not (Select-String -Quiet -Path $log -Pattern "installer=msi")) { throw "the log does not say msi" }
          Stop-Service go-fs
          if (-not (Select-String -Quiet -Path $log -Pattern "shutdown complete")) { throw "no clean shutdown" }
          $uninstall = Start-Process msiexec -Wait -PassThru -ArgumentList "/x go-fs.msi /qn /l*v uninstall.log"
          if ($uninstall.ExitCode -ne 0) { Get-Content uninstall.log -Tail 80; exit $uninstall.ExitCode }
          if (Get-Service go-fs -ErrorAction SilentlyContinue) { throw "the service is still there" }
          if (-not (Test-Path "$env:ProgramData\go-fs\go-fs.toml")) { throw "the uninstall removed the configuration" }
