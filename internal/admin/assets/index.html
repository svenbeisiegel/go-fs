<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%232f6f4f' d='M1.5 2.5h4.2l1.4 1.8h7.4v9.2h-13z'/%3E%3C/svg%3E">
<title>go-fs configuration</title>
<style nonce="{{.Nonce}}">{{.Style}}</style>
</head>
<body>
<svg id="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 5.5h5.5l2 2.5H21v10.5H3z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3 3.5 7.5v9L12 21l8.5-4.5v-9z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M11 4H5v16h6"/><path d="M20 12H10m3.5-3.5L17 12l-3.5 3.5"/></symbol>
  <symbol id="i-caret" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
</svg>

<header>
  <h1>go-fs</h1>
  <p id="path" class="path"></p>
  <details class="nav">
    <summary class="plain">Admin<svg class="ic caret"><use href="#i-caret"/></svg></summary>
    <div class="menu">
      <a href="{{.Files}}"><svg class="ic"><use href="#i-folder"/></svg>Files</a>
      {{if .Registry}}<a href="{{.Registry}}"><svg class="ic"><use href="#i-box"/></svg>Registry</a>{{end}}
      <form class="inline" method="post" action="{{.Logout}}"><button type="submit"><svg class="ic"><use href="#i-logout"/></svg>Log out{{with .User}} {{.}}{{end}}</button></form>
    </div>
  </details>
</header>

<div id="banner" class="banner" hidden></div>
<div id="release-notice" class="banner good" hidden></div>

<nav id="tabs" class="tabs" role="tablist"></nav>
<main id="panels"></main>

<footer id="footer" hidden>
  <span id="status" class="status"></span>
  <button id="apply" type="button">Apply</button>
</footer>

<script nonce="{{.Nonce}}">{{.Script}}</script>
</body>
</html>
