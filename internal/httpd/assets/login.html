<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%232f6f4f' d='M1.5 2.5h4.2l1.4 1.8h7.4v9.2h-13z'/%3E%3C/svg%3E">
<title>Log in</title>
<style nonce="{{.Nonce}}">{{.Style}}</style>
</head>
<body class="signin">

<svg id="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 5.5h5.5l2 2.5H21v10.5H3z"/></symbol>
  <symbol id="i-login" viewBox="0 0 24 24"><path d="M13 4h6v16h-6"/><path d="M4 12h10m-3.5-3.5L14 12l-3.5 3.5"/></symbol>
</svg>

<main>
<form class="card" method="post" action="{{.Action}}">
  <h1><svg class="ic"><use href="#i-login"/></svg>Log in</h1>
  <p class="where"><svg class="ic dir"><use href="#i-folder"/></svg>{{.Path}}</p>
  {{if .Message}}<p class="problem" role="alert">{{.Message}}</p>{{end}}
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <div class="row">
    <button class="go" type="submit">Log in</button>
    <a class="plain" href="{{.Cancel}}">Cancel</a>
  </div>
</form>
</main>

</body>
</html>
